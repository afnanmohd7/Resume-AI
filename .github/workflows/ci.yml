# Typecheck and build on pull requests, so a broken change never reaches main.
name: CI

# Vercel builds and deploys on push; this is the independent check that a
# change typechecks and builds before it is merged.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
